<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>LightTime</title><style>
:root{color-scheme:light dark;--bg:#fafafa;--card:#fff;--text:#202020;--muted:#777;--line:#e5e5e5;--green:#16834e;--red:#c04444} @media(prefers-color-scheme:dark){:root{--bg:#171717;--card:#212121;--text:#eee;--muted:#aaa;--line:#383838;--green:#64d99b;--red:#ff8888}} [data-theme=dark]{color-scheme:dark;--bg:#171717;--card:#212121;--text:#eee;--muted:#aaa;--line:#383838;--green:#64d99b;--red:#ff8888}[data-theme=light]{color-scheme:light;--bg:#fafafa;--card:#fff;--text:#202020;--muted:#777;--line:#e5e5e5;--green:#16834e;--red:#c04444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:28px 16px}header,.slot,.tabs{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;margin:0}h2{font-size:17px}small,.muted,footer{color:var(--muted)}section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:18px 0}button,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}button[aria-pressed=true]{background:var(--text);color:var(--bg)}.big{font-size:52px;font-weight:650;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:8px 0}.on{color:var(--green)}.off{color:var(--red)}.slot{padding:13px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.slot:last-child{border:0}.current{font-weight:700}.tabs button{flex:1}footer{text-align:center;font-size:13px;line-height:1.8}a{color:inherit}#notice{font-size:13px;line-height:1.5}#bar{display:flex;gap:2px;margin:16px 0}#bar i{height:9px;flex:1;border-radius:2px;background:currentColor}
</style><main><header><h1>⚡ LightTime</h1><button id="theme" aria-label="Сменить тему">◐</button></header><p class="muted">Чернигов · <label>Очередь <select id="queue"></select></label></p><section><small id="headline">Ближайшее изменение по графику</small><div class="big" id="next">—</div><div id="count" class="muted">Загрузка графика…</div><p id="status"></p><div id="notice" class="muted" role="status"></div></section><section><div class="tabs"><button id="today" aria-pressed="true">Сегодня</button><button id="tomorrow" aria-pressed="false">Завтра</button></div><h2 id="date"></h2><div id="bar"></div><div id="slots"></div></section><footer><button id="refresh">Обновить график</button><p id="updated"></p><a href="https://github.com/yaroslav2901/OE_OUTAGE_DATA">Источник графика</a> · <a href="https://chernihivoblenergo.com.ua/">Облэнерго</a><p>Плановые отключения не гарантируют фактическое наличие света.</p>С любовью, специально для тебя ♡</footer></main><script>
const $=id=>document.getElementById(id), url='https://raw.githubusercontent.com/yaroslav2901/OE_OUTAGE_DATA/main/data/Chernihivoblenergo.json', zone='Europe/Kyiv';
const read=k=>{try{return localStorage.getItem(k)}catch{return null}},save=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let data=null,offline=false,day=0,busy=false;
const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function parts(d){return Object.fromEntries(fmt.formatToParts(d).map(x=>[x.type,x.value]))}
function key(d){let p=parts(d);return p.year+'-'+p.month+'-'+p.day}
function tomorrow(d){let p=parts(d);return new Date(Date.UTC(+p.year,+p.month-1,+p.day+1,12))}
function time(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
for(let i=1;i<=6;i++)for(let j=1;j<=2;j++){let q=i+'.'+j;$('queue').add(new Option(q,q))}
$('queue').value=read('queue')||'4.2';if(!$('queue').value)$('queue').value='4.2';
function slots(k){let entry=Object.entries(data?.fact?.data||{}).find(([t])=>key(new Date(Number(t)*1000))===k);let g=entry?.[1]?.['GPV'+$('queue').value];if(!g)return null;let a=[];for(let h=1;h<=24;h++){let v=g[h];if(!['yes','no','first','second'].includes(v))return null;a.push(v==='yes'||v==='second',v==='yes'||v==='first')}return a}
function render(){let now=new Date(),p=parts(now),m=+p.hour*60+ +p.minute,k=key(now),t=key(tomorrow(now)),a=slots(k),b=slots(t),s=day?b:a;let stamp=Date.parse(data?.lastUpdated),stale=!Number.isFinite(stamp)||now-stamp>6*3600000||stamp-now>300000;
$('date').textContent=day?t:k;$('today').setAttribute('aria-pressed',String(!day));$('tomorrow').setAttribute('aria-pressed',String(!!day));$('slots').replaceChildren();$('bar').replaceChildren();
$('notice').textContent=(offline?'Нет связи с источником. ':'')+(stale&&data?'Данные старше 6 часов или дата обновления неизвестна. Проверьте официальный график.':'');
$('updated').textContent=Number.isFinite(stamp)?'Источник обновлён: '+new Date(stamp).toLocaleString('ru-UA',{timeZone:zone}):'Нет данных об обновлении';
$('next').textContent='—';$('next').className='big';$('status').textContent='';$('count').textContent='Нет подтверждённого графика на сегодня';
if(a){let idx=Math.floor(m/30),v=a[idx],all=b?a.concat(b):a,n=all.findIndex((x,i)=>i>idx&&x!==v);$('status').textContent='По графику сейчас: '+(v?'есть свет':'нет света');$('status').className=v?'on':'off';if(n>=0&&!stale){$('headline').textContent=v?'Ближайшее отключение':'Ближайшее включение';$('next').textContent=(n>=48?'Завтра ':'')+time(n*30%1440);$('next').className='big '+(v?'off':'on');$('count').textContent='Осталось '+Math.floor((n*30-m)/60)+' ч '+(n*30-m)%60+' мин'}else{$('headline').textContent='Ближайшее изменение';$('count').textContent=stale?'Таймер недоступен: график устарел':'В опубликованном графике изменений больше нет'}}
if(!s){$('slots').textContent='График пока не опубликован или недоступен.';return}for(let v of s){let el=document.createElement('i');el.className=v?'on':'off';$('bar').append(el)}for(let i=0;i<48;){let j=i+1;while(j<48&&s[j]===s[i])j++;let el=document.createElement('div');el.className='slot'+(!day&&m>=i*30&&m<j*30?' current':'');let left=document.createElement('span'),right=document.createElement('span');left.textContent=time(i*30)+' – '+time(j*30);right.textContent=s[i]?'ϟ Есть свет':'⊘ Нет света';right.className=s[i]?'on':'off';el.append(left,right);$('slots').append(el);i=j}}
async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;try{let r=await fetch(url+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error();let d=await r.json();if(!d.fact?.data||!Number.isFinite(Date.parse(d.lastUpdated)))throw Error();data=d;save('schedule',JSON.stringify(d));offline=false}catch{offline=true}finally{busy=false;$('refresh').disabled=false;render()}}
try{data=JSON.parse(read('schedule'))}catch{}$('queue').onchange=()=>{save('queue',$('queue').value);render()};$('today').onclick=()=>{day=0;render()};$('tomorrow').onclick=()=>{day=1;render()};$('refresh').onclick=refresh;document.documentElement.dataset.theme=read('theme')||'';$('theme').onclick=()=>{let dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'light':'dark';save('theme',document.documentElement.dataset.theme)};render();refresh();setInterval(refresh,60000);setInterval(render,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></html>
